<script>
const recipes = [{"id": 1, "name": "Mie Aceh Goreng", "description": "Hidangan mi berbumbu kari dengan sayuran dan pilihan daging atau seafood.", "ingredients": ["300 g mi kuning basah", "150 g udang atau irisan daging sapi", "3 siung bawang putih dan 5 bawang merah, haluskan", "2 sdm pasta bumbu kari Aceh atau bumbu kari siap pakai", "1 tomat,  kol, dan tauge secukupnya", "2 sdm kecap manis, garam, dan minyak"], "steps": ["Tumis bumbu halus sampai harum.", "Masukkan udang atau daging. Masak hingga matang; tambahkan sedikit air bila perlu.", "Masukkan tomat, kol, dan mi. Aduk rata.", "Tambahkan kecap, garam, dan tauge. Masak sampai mi panas dan bumbu meresap."]}, {"id": 2, "name": "Mie Aceh Kuah", "description": "Versi berkuah dengan rasa rempah yang hangat.", "ingredients": ["300 g mi kuning basah", "150 g udang atau ayam", "5 bawang merah, 3 bawang putih, dan 2 cm jahe, haluskan", "1 sdm bubuk kari, 1 sdt ketumbar", "1 tomat, kol, dan daun bawang", "700 ml kaldu, garam, dan minyak"], "steps": ["Tumis bumbu hingga matang dan harum.", "Masukkan protein pilihan dan aduk sampai berubah warna.", "Tuang kaldu. Didihkan hingga protein matang.", "Masukkan mi, tomat, dan kol. Bumbui, lalu masak sebentar. Taburi daun bawang."]}, {"id": 3, "name": "Ayam Tangkap", "description": "Ayam goreng berbumbu yang disajikan bersama daun kari dan daun pandan.", "ingredients": ["700 g ayam, potong kecil", "4 bawang putih, 6 bawang merah, 2 cm jahe, haluskan", "1 sdt ketumbar, 1 sdt kunyit, garam", "2 batang daun pandan, potong", "2 genggam daun kari", "Minyak secukupnya"], "steps": ["Lumuri ayam dengan bumbu halus dan diamkan 20–30 menit di lemari pendingin.", "Ungkep ayam dengan sedikit air sampai empuk dan air menyusut.", "Panaskan minyak. Goreng ayam hingga kecokelatan dan matang sempurna.", "Goreng daun pandan dan daun kari sebentar hingga harum. Sajikan bersama ayam."]}, {"id": 4, "name": "Kuah Beulangong", "description": "Gulai daging dan nangka muda yang lekat dengan tradisi kenduri Aceh.", "ingredients": ["500 g daging sapi atau kambing", "400 g nangka muda, rebus sebentar", "8 bawang merah, 4 bawang putih", "3 cm jahe, 3 cm kunyit, 3 cm lengkuas", "2 sdm ketumbar, 1 sdt jintan, cabai sesuai selera", "500 ml santan encer, 300 ml air, garam, daun kari"], "steps": ["Haluskan bawang, jahe, kunyit, lengkuas, ketumbar, jintan, dan cabai.", "Masukkan bumbu, daging, dan air ke panci. Masak sampai daging mulai empuk.", "Tambahkan nangka, santan encer, daun kari, dan garam.", "Masak perlahan sambil diaduk sesekali hingga daging empuk dan kuah berbumbu."]}, {"id": 5, "name": "Sie Reuboh", "description": "Daging sapi berbumbu cuka khas Aceh Besar; rasanya gurih, asam, dan kaya rempah.", "ingredients": ["500 g daging sapi berlemak, potong", "5 bawang merah, 4 bawang putih", "3 cm kunyit, 2 cm jahe, 2 cm lengkuas", "1 sdt ketumbar, cabai merah sesuai selera", "3 sdm cuka makan atau cuka aren, 300 ml air", "Garam secukupnya"], "steps": ["Haluskan bawang, kunyit, jahe, ketumbar, dan cabai.", "Campur daging dengan bumbu, lengkuas, cuka, garam, dan air dalam panci.", "Masak tertutup dengan api kecil hingga daging empuk. Tambahkan air bila perlu.", "Koreksi rasa asam dan asin. Masak sampai bumbu meresap."]}, {"id": 6, "name": "Kuah Pliek U", "description": "Sayur bersantan dengan pliek u (ampas kelapa fermentasi khas Aceh).", "ingredients": ["2 sdm pliek u, seduh air hangat lalu saring bila berpasir", "1 ikat daun melinjo, 100 g kacang panjang", "100 g labu siam, 100 g terong", "1 genggam daun jeruk purut atau daun kari", "5 bawang merah, 3 bawang putih, 2 cabai, 2 cm kunyit", "700 ml santan encer, garam"], "steps": ["Haluskan bawang, cabai, dan kunyit. Tumis sampai harum.", "Larutkan pliek u dengan sedikit santan, lalu masukkan ke panci bersama sisa santan.", "Masukkan bumbu, sayuran yang keras lebih dahulu, lalu sayuran lainnya.", "Masak dengan api kecil sampai sayur matang. Bumbui dan aduk agar santan tidak pecah."]}, {"id": 7, "name": "Eungkot Paya", "description": "Olahan ikan air tawar khas Aceh yang dimasak dengan rempah dan asam.", "ingredients": ["500 g ikan gabus atau ikan air tawar, bersihkan", "6 bawang merah, 3 bawang putih", "2 cm kunyit, 2 cm jahe, 2 cabai merah", "1 batang serai, 2 lembar daun jeruk", "1 sdm air asam jawa, 500 ml air, garam"], "steps": ["Lumuri ikan dengan sedikit garam dan air asam selama 10 menit.", "Haluskan bawang, kunyit, jahe, dan cabai. Tumis bersama serai dan daun jeruk.", "Tuang air dan didihkan. Masukkan ikan dengan hati-hati.", "Masak hingga ikan matang dan kuah beraroma. Sesuaikan garam dan asam."]}, {"id": 8, "name": "Asam Keueng Ikan", "description": "Masakan ikan berkuah kuning dengan rasa asam dan pedas segar.", "ingredients": ["500 g ikan tongkol atau kembung", "5 bawang merah, 3 bawang putih", "3 cm kunyit, 2 cm jahe, 5 cabai rawit", "1 sdm asam sunti halus atau air asam jawa", "1 batang serai, 500 ml air, garam"], "steps": ["Bersihkan ikan dan lumuri sedikit garam.", "Haluskan bawang, kunyit, jahe, cabai, dan asam sunti.", "Didihkan bumbu bersama air dan serai.", "Masukkan ikan. Masak perlahan sampai matang; jangan terlalu sering mengaduk agar ikan tidak hancur."]}, {"id": 9, "name": "Asam Udeung (Sambal Udang)", "description": "Sambal udang khas Aceh dengan aroma daun jeruk dan rasa asam segar.", "ingredients": ["150 g udang rebus, kupas dan cincang kasar", "5 cabai rawit, 4 bawang merah", "1 batang serai bagian putih, iris sangat tipis", "3 lembar daun jeruk, buang tulang lalu iris", "1 sdm air jeruk nipis, garam secukupnya"], "steps": ["Pastikan udang direbus sampai matang, lalu tiriskan.", "Ulek cabai dan garam, kemudian campurkan bawang merah dan serai.", "Masukkan udang dan daun jeruk. Aduk atau ulek ringan.", "Tambahkan air jeruk nipis. Cicipi dan sajikan segera."]}, {"id": 10, "name": "Gulai Kambing Aceh", "description": "Gulai pekat dengan rempah aromatik yang cocok disantap bersama nasi.", "ingredients": ["600 g daging kambing", "8 bawang merah, 4 bawang putih", "3 cm jahe, 3 cm kunyit, 2 cm lengkuas", "2 sdm ketumbar, 1 sdt jintan, 3 butir kapulaga", "2 batang serai, 2 lembar daun salam", "500 ml santan, 500 ml air, garam"], "steps": ["Haluskan bawang, jahe, kunyit, ketumbar, dan jintan.", "Tumis bumbu bersama serai, lengkuas, kapulaga, dan daun salam.", "Masukkan daging dan aduk hingga terbalut bumbu. Tambahkan air dan masak sampai empuk.", "Tuang santan dan masak api kecil sambil diaduk hingga kuah mengental."]}, {"id": 11, "name": "Kuah Masam Keueng Udang", "description": "Kuah udang asam pedas yang ringan dan segar.", "ingredients": ["300 g udang, bersihkan", "5 bawang merah, 2 bawang putih", "2 cm kunyit, 4 cabai rawit", "1 sdm air asam jawa, 1 batang serai", "600 ml air, garam, daun kemangi (opsional)"], "steps": ["Haluskan bawang, kunyit, dan cabai.", "Didihkan air bersama bumbu, serai, dan air asam.", "Masukkan udang dan masak sampai berubah warna serta matang.", "Tambahkan garam dan kemangi bila digunakan. Sajikan hangat."]}, {"id": 12, "name": "Ikan Kayu Tumis", "description": "Ikan kayu atau keumamah dimasak tumis dengan cabai dan bawang.", "ingredients": ["200 g ikan kayu/keumamah, suwir atau iris tipis", "6 bawang merah, 3 bawang putih", "5 cabai merah, 5 cabai rawit", "1 buah tomat, 1 batang serai", "2 lembar daun jeruk, 2 sdm minyak, garam"], "steps": ["Jika ikan kayu sangat kering, rendam sebentar lalu tiriskan.", "Tumis bawang dan cabai hingga harum. Masukkan serai dan daun jeruk.", "Masukkan ikan kayu dan tomat. Aduk hingga bumbu merata.", "Tambahkan sedikit air bila terlalu kering. Masak sampai bumbu meresap."]}, {"id": 13, "name": "Nasi Gurih Aceh", "description": "Nasi santan beraroma rempah untuk sarapan atau hidangan keluarga.", "ingredients": ["500 g beras, cuci bersih", "400 ml santan encer", "2 lembar daun pandan, 2 daun salam", "1 batang serai, memarkan", "2 cm jahe, iris, 1 sdt garam"], "steps": ["Masukkan beras, santan, pandan, salam, serai, jahe, dan garam ke rice cooker atau panci.", "Masak hingga cairan terserap dan beras setengah matang.", "Kukus 20–25 menit sampai nasi pulen dan matang.", "Aduk ringan sebelum disajikan."]}, {"id": 14, "name": "Kuah Kanji Rumbi", "description": "Bubur beras gurih berempah yang populer sebagai hidangan berbuka di Aceh.", "ingredients": ["150 g beras, cuci", "150 g ayam, potong kecil", "1,2 liter air atau kaldu", "4 bawang merah, 2 bawang putih, 2 cm jahe", "1 batang serai, 2 kapulaga, 2 cengkih", "Wortel dan kentang potong kecil, garam, daun seledri"], "steps": ["Tumis bawang dan jahe hingga harum. Masukkan serai dan rempah utuh.", "Tambahkan ayam dan aduk sampai berubah warna.", "Tuang kaldu, masukkan beras, lalu masak sambil diaduk berkala hingga menjadi bubur.", "Masukkan wortel dan kentang. Masak sampai lunak dan ayam matang. Taburi seledri."]}, {"id": 15, "name": "Tumis Daun Ubi Aceh", "description": "Sayur daun singkong berbumbu sederhana sebagai lauk rumahan.", "ingredients": ["1 ikat daun singkong, petik dan rebus hingga empuk", "5 bawang merah, 3 bawang putih", "5 cabai merah atau sesuai selera", "1 batang serai, 2 lembar daun jeruk", "100 ml santan encer (opsional), garam dan minyak"], "steps": ["Peras daun singkong rebus dan iris kasar.", "Tumis bawang, cabai, serai, dan daun jeruk hingga harum.", "Masukkan daun singkong dan aduk rata.", "Tambahkan santan bila suka. Masak hingga bumbu meresap dan koreksi rasa."]}, {"id": 16, "name": "Gulai Nangka Muda", "description": "Gulai sayur nangka dengan santan dan rempah.", "ingredients": ["500 g nangka muda, rebus hingga setengah empuk", "6 bawang merah, 3 bawang putih", "2 cm kunyit, 2 cm jahe, 2 cm lengkuas", "1 batang serai, 2 daun salam", "600 ml santan encer, garam, cabai sesuai selera"], "steps": ["Haluskan bawang, kunyit, jahe, dan cabai.", "Tumis bumbu bersama lengkuas, serai, dan daun salam.", "Masukkan nangka dan santan. Masak dengan api kecil.", "Aduk perlahan sampai nangka empuk dan kuah berbumbu."]}, {"id": 17, "name": "Martabak Aceh", "description": "Martabak gurih berisi telur dan daun bawang dengan kulit tipis.", "ingredients": ["2 lembar kulit martabak siap pakai", "3 telur", "2 batang daun bawang, iris", "1/2 bawang bombai, cincang", "1 sdt bubuk kari, garam, merica", "Minyak untuk menggoreng"], "steps": ["Kocok telur bersama daun bawang, bawang bombai, kari, garam, dan merica.", "Letakkan kulit martabak di wajan datar dengan sedikit minyak.", "Tuang isian, lipat sisi kulit membentuk amplop.", "Goreng kedua sisi sampai keemasan dan bagian telur matang."]}, {"id": 18, "name": "Roti Cane", "description": "Roti pipih berlapis yang nikmat dengan kari atau gula.", "ingredients": ["300 g tepung terigu", "1 telur", "150 ml air hangat (sesuaikan)", "2 sdm margarin cair", "1/2 sdt garam", "Margarin atau minyak untuk merendam dan memanggang"], "steps": ["Campur tepung, telur, air, margarin cair, dan garam. Uleni sampai kalis.", "Bagi adonan, bulatkan, olesi margarin, tutup dan istirahatkan 2 jam.", "Pipihkan setipis mungkin, olesi margarin, gulung memanjang lalu bentuk spiral.", "Pipihkan kembali dan panggang di wajan sampai kedua sisi kecokelatan."]}, {"id": 19, "name": "Timphan Pisang", "description": "Kue kukus berbalut daun pisang, salah satu kudapan khas Aceh.", "ingredients": ["250 g tepung ketan", "2 pisang raja matang, lumatkan", "150 ml santan hangat (secukupnya)", "Sejumput garam", "Isian: srikaya atau kelapa gula merah", "Daun pisang muda untuk membungkus"], "steps": ["Campur tepung ketan, pisang, garam, dan santan sedikit demi sedikit sampai adonan bisa dipulung.", "Ambil adonan, pipihkan di atas daun pisang yang dioles tipis minyak.", "Beri sedikit isian, gulung dan lipat ujung daun.", "Kukus 20–25 menit sampai matang. Dinginkan sebelum disajikan."]}, {"id": 20, "name": "Kue Adee Pidie", "description": "Kue panggang lembut dengan aroma pandan dan santan.", "ingredients": ["250 g tepung terigu", "150 g gula", "2 telur", "300 ml santan", "2 sdm margarin cair", "1/2 sdt garam, 1/2 sdt vanili, pasta pandan secukupnya"], "steps": ["Kocok telur dan gula sampai gula larut.", "Masukkan tepung bergantian dengan santan sambil diaduk hingga licin.", "Tambahkan margarin, garam, vanili, dan pandan.", "Tuang ke loyang beroles margarin. Panggang  oven 170°C sekitar 35–45 menit hingga matang."]}, {"id": 21, "name": "Keukarah", "description": "Kue renyah berbentuk jaring yang dikenal sebagai kudapan tradisional Aceh.", "ingredients": ["200 g tepung beras", "50 g tepung tapioka", "150 g gula pasir", "250–300 ml air", "Sejumput garam", "Minyak untuk menggoreng"], "steps": ["Campur tepung, gula, garam, dan air hingga menjadi adonan encer tanpa gumpalan.", "Saring adonan lalu masukkan ke cetakan berlubang kecil atau botol tekan khusus.", "Tuang melingkar dan bersilang di atas minyak panas dengan bantuan orang dewasa.", "Goreng sebentar hingga renyah, angkat dan tiriskan."]}, {"id": 22, "name": "Bhoi (Kue Bolu Aceh)", "description": "Kue bolu tradisional yang sering dicetak dalam bentuk ikan atau bunga.", "ingredients": ["4 telur", "150 g gula", "150 g tepung terigu", "1/2 sdt emulsifier (opsional)", "1/2 sdt vanili", "Margarin untuk olesan cetakan"], "steps": ["Kocok telur dan gula sampai kental dan mengembang.", "Masukkan tepung dan vanili bertahap, aduk balik hingga rata.", "Tuang ke cetakan kecil yang sudah dioles margarin.", "Panggang pada 170°C selama 15–20 menit atau sampai matang."]}, {"id": 23, "name": "Meuseukat", "description": "Manisan lembut berbahan nanas yang dikenal sebagai sajian khas Aceh.", "ingredients": ["1 kg nanas parut atau blender kasar", "250–300 g gula pasir", "100 g tepung terigu, larutkan dengan sedikit air", "1 sdm air jeruk nipis", "Sejumput garam"], "steps": ["Masak nanas dan gula dalam wajan tebal dengan api kecil sambil diaduk.", "Setelah mengental, masukkan larutan tepung sedikit demi sedikit.", "Aduk terus hingga adonan sangat kental dan tidak mudah melebar.", "Tambahkan air jeruk dan garam. Dinginkan, lalu bentuk atau potong."]}, {"id": 24, "name": "Pulot Bakar", "description": "Ketan gurih yang dibungkus daun pisang lalu dipanggang.", "ingredients": ["300 g beras ketan, rendam 2 jam", "200 ml santan", "1/2 sdt garam", "Daun pisang untuk membungkus"], "steps": ["Kukus ketan 15 menit hingga setengah matang.", "Didihkan santan dan garam, siramkan ke ketan. Aduk dan diamkan 10 menit.", "Kukus kembali 20 menit hingga pulen.", "Bungkus memanjang dengan daun pisang dan panggang di atas wajan/panggangan sampai harum."]}, {"id": 25, "name": "Bubur Boh Manok", "description": "Bubur telur dan santan sederhana dengan rasa manis lembut.", "ingredients": ["500 ml santan", "2 telur", "80 g gula", "2 sdm tepung beras, larutkan", "1 lembar daun pandan", "Sejumput garam"], "steps": ["Kocok telur dan gula hingga tercampur.", "Panaskan santan bersama pandan dan garam dengan api kecil.", "Masukkan larutan tepung, lalu tuang telur perlahan sambil terus diaduk.", "Masak sampai mengental dan matang. Jangan biarkan mendidih terlalu kuat."]}, {"id": 26, "name": "Sambal Ganja (Asam Udeung)", "description": "Nama populer sambal Aceh berbahan udang dan rempah; tidak mengandung ganja.", "ingredients": ["150 g udang kecil, rebus matang dan kupas", "5 cabai rawit, 4 bawang merah", "1 batang serai bagian putih, iris", "3 lembar daun jeruk, iris", "1 sdm air jeruk nipis, garam"], "steps": ["Ulek cabai dan garam hingga halus.", "Tambahkan bawang merah, serai, dan daun jeruk; ulek kasar.", "Masukkan udang matang dan aduk hingga tercampur.", "Beri air jeruk nipis. Sajikan segera dan simpan sisa dalam lemari pendingin."]}, {"id": 27, "name": "Kopi Sanger", "description": "Minuman kopi susu khas Aceh dengan rasa kopi yang tetap kuat.", "ingredients": ["2 sdt kopi bubuk hitam", "150 ml air panas", "2–3 sdm susu kental manis", "1–2 sdt gula (opsional)"], "steps": ["Seduh kopi dengan air panas dan saring.", "Campurkan susu kental manis dan gula sesuai selera.", "Tuang kopi ke gelas berisi campuran susu.", "Aduk atau tuang bergantian untuk menghasilkan busa ringan."]}, {"id": 28, "name": "Teh Tarik Aceh", "description": "Teh susu berbusa yang biasa dinikmati bersama kudapan.", "ingredients": ["2 sdt teh hitam atau 2 kantong teh", "200 ml air panas", "2–3 sdm susu kental manis", "Sedikit gula bila perlu"], "steps": ["Seduh teh sampai pekat lalu saring.", "Campur teh dengan susu kental manis.", "Tuang bergantian di antara dua wadah tahan panas dengan jarak rendah dan hati-hati, atau cukup aduk kuat.", "Sajikan hangat. Hindari menuang dari ketinggian untuk mencegah tumpahan panas."]}, {"id": 29, "name": "Kuah Sie Kameng Sederhana", "description": "Sup kambing berempah yang hangat dengan kuah bening.", "ingredients": ["500 g daging kambing bertulang", "1,5 liter air", "6 bawang merah, 3 bawang putih", "2 cm jahe, 1 sdt ketumbar", "2 kapulaga, 2 cengkih, 1 batang kayu manis kecil", "1 batang serai, daun bawang, garam"], "steps": ["Rebus daging sebentar, buang air rebusan pertama bila ingin kuah lebih ringan.", "Didihkan air baru, masukkan daging dan rempah utuh.", "Tumis bawang, jahe, dan ketumbar lalu masukkan ke panci.", "Masak hingga daging empuk. Bumbui dan taburi daun bawang."]}, {"id": 30, "name": "Pisang Sale Aceh", "description": "Camilan pisang manis yang dikeringkan lalu dapat digoreng atau dinikmati langsung.", "ingredients": ["6 pisang matang yang masih kokoh", "Minyak secukupnya bila ingin digoreng", "Larutan tipis tepung beras (opsional): 4 sdm tepung beras, 70 ml air, sejumput garam"], "steps": ["Kupas dan iris pisang memanjang tipis.", "Susun terpisah dan jemur dengan penutup jaring makanan sampai kering lentur; bawa masuk saat malam atau cuaca lembap.", "Untuk versi goreng, celupkan sale kering ke larutan tepung tipis.", "Goreng dengan pengawasan orang dewasa hingga renyah, lalu tiriskan."]}];
const category = r => r.name.includes("Kopi")||r.name.includes("Teh Tarik") ? "minuman" :
(/Timphan|Adee|Keukarah|Bhoi|Meuseukat|Pulot|Bubur Boh|Pisang Sale/.test(r.name) ? "kue" : "utama");
const emojis = ["🍜","🍲","🍗","🥘","🍖","🥬","🐟","🐠","🦐","🍛","🍤","🐟","🍚","🥣","🥬","🥘","🥘","🫓","🫓","🍌","🍰","🍪","🧁","🍍","🍘","🥣","🍡","☕","🫖","🍲"];
const cards=document.getElementById('cards'), list=document.getElementById('list'), detail=document.getElementById('detail');
let filter='all';
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 const shown=recipes.filter(r=>(filter==='all'||category(r)===filter)&&(r.name+' '+r.description).toLowerCase().includes(q));
 cards.innerHTML=shown.map(r=>`<article class="card"><div class="emoji">${emojis[r.id-1]||'🍽️'}</div><h3>${r.id}. ${r.name}</h3><p>${r.description}</p><button data-id="${r.id}">Lihat resep</button></article>`).join('');
 cards.querySelectorAll('button').forEach(b=>b.onclick=()=>openRecipe(+b.dataset.id));
}
function openRecipe(id){
 const r=recipes.find(x=>x.id===id); list.classList.add('hidden');detail.classList.remove('hidden');
 document.getElementById('detailBody').innerHTML=`<div class="emoji">${emojis[id-1]||'🍽️'}</div><div class="muted">RESEP ${String(id).padStart(2,'0')} DARI 30</div><h2>${r.name}</h2><p>${r.description}</p><h3>Bahan-bahan</h3><ul>${r.ingredients.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Cara membuat</h3><ol>${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`;
 window.scrollTo(0,0);
}
document.getElementById('back').onclick=()=>{detail.classList.add('hidden');list.classList.remove('hidden');window.scrollTo(0,0)};
document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
render();
</script>
</body></html>
